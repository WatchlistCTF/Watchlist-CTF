# ctfcli challenge spec. Contains the flag.
name: "Manifest"
author: "XposedOrNot"
category: "OSINT"
type: standard
value: 350
state: visible
version: "0.1"

description: |
  [ FILE REF: "MANIFEST" // METRO AIRSPACE - ONE WEEK OF EXHAUST ]

  Aircraft are required to announce themselves. Position, altitude,
  heading - broadcast in the clear, once a second, to anyone with an
  antenna. It is the law. The people who fly the interesting missions
  know this. They forget it anyway.

  I pulled a week of one metro's traffic. Most of it is nothing -
  couriers, charters, the same six business jets flying the same
  boring triangles.

  Twice this week, an aircraft did something it did not file. It went
  somewhere, and then it went in circles. Once on Monday. Once on
  Thursday. Two different tails. They think that makes them two
  different stories.

  It does not. They were looking at the same thing.

  Find both. Prove they watched the same ground. Tell me what was
  underneath them - the coordinate is not on any list I gave you,
  because someone made sure it wouldn't be.

    - THE MACHINE

    Files: fleet_week_20260914-20260920.json  (the week of traffic)
           sites.csv                          (known facilities in the metro)
           registry.json                      (grid registry - keyed by location)

flags:
  - "number{overwatch_confirmed_5a3f}"

tags:
  - "O250"

files:
  - files/74fbd4e07ff56e85.tar.gz

hints:
  - content: "You cannot read thirty thousand points, you have to summarize behaviour. Group every position report by its hex (the 24-bit ICAO address, the one identifier an aircraft cannot change in flight). For each airframe, ask one question: did it fly in a straight line, or in circles? Most of the fleet is transit. A few are not."
    cost: 40
  - content: "More than one aircraft circles, but circling is not always surveillance. A holding pattern orbits at a steady, level altitude over a published fix. An aircraft watching the ground orbits low, tight, and at a wandering altitude, over a spot that is not a navigation fix. Compare the altitude profiles. Then notice: two of them, on different days, circle the same place, and that place is not in sites.csv."
    cost: 80
  - content: "The two surveillance aircraft each hide a word, one in a run of unusual squawk codes (read them as octal, decode to text), one in the callsign it switches to. Neither word is the flag alone. Average each aircraft's orbit points to a centroid; they agree on one coordinate. Quantize it to a grid cell and look it up in registry.json, the right cell gives a segment, the wrong ones give zeros. The flag is the two words plus what the registry confirms."
    cost: 130
