<!--
  WATCHLIST CTF - B350 "Contingency"  ::  /contingency  (the Machine's cold failover)
  Self-contained: no external fonts/scripts/requests. Drops into a CTFd Custom Page.
  The deliberate inverse of B200 /badcode: cold, clinical, never addresses the observer.
  The flag is NOT stored in source - it is XOR-derived from the sealed payload at runtime.
  Recovery key is leaked in plain sight via the node telemetry (seg bytes, in node order).
  Standalone: validates locally. Inside CTFd: POSTs to the attempt endpoint (CSRF nonce).
  Set CHAL_ID below at deploy (Option A: Anonymized challenge), same as B200.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTINGENCY</title>
<style>
  :root{
    --bg:#050a12; --panel:#070e18;
    --fg:#b9cde2;            /* cold blue-white */
    --bright:#e9f3fc;
    --cyan:#4ea8ff;

    --dim:#56697f;
    --ok:#46c08a;
    --alert:#ff5b6e;
    --line:rgba(78,168,255,.16);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--fg); font-family:var(--mono); font-size:15px; line-height:1.5;
    letter-spacing:.4px;
    background:
      linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 100%,
      radial-gradient(120% 90% at 50% -10%,#0a1626,var(--bg) 70%);
    text-transform:uppercase;
  }
  /* faint clinical scan, mechanical not warm */
  .veil{position:fixed; inset:0; pointer-events:none; z-index:9;
    background:radial-gradient(130% 110% at 50% 0%,transparent 60%,rgba(0,0,0,.5));}

  .sys{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:5vh 22px 40px;
    min-height:calc(100vh - 150px);}
  .bar{display:flex; align-items:center; gap:14px; border:1px solid var(--line);
    padding:8px 14px; color:var(--cyan); font-weight:600; letter-spacing:1.5px}
  .bar .stat{margin-left:auto; color:var(--ok)}
  .bar .stat.dead{color:var(--alert)}

  #screen{margin:18px 0 8px}
  .line{white-space:pre-wrap; word-break:break-word; margin:0 0 3px}
  .dots{color:var(--dim)}
  .term{color:var(--alert)}
  .classify{display:inline-block; margin-top:6px; padding:3px 10px;
    border:1px solid var(--alert); color:var(--alert); letter-spacing:3px; font-weight:600}
  .proceed{color:var(--cyan)}

  /* reconstruction bar - advances mechanically, ignores the observer */
  #recon{display:flex; align-items:center; gap:12px; margin:16px 0 10px; color:var(--dim)}
  #recon .lbl{min-width:130px}
  .rbar{flex:1; height:10px; border:1px solid var(--line); position:relative; overflow:hidden}
  .rbar i{position:absolute; inset:0 100% 0 0;
    background:linear-gradient(90deg,#143b5e,#2f78bd); transition:right .18s linear}
  #rpct{min-width:46px; text-align:right; color:var(--cyan)}

  #nodes{border:1px solid var(--line); padding:10px 12px; margin:4px 0 16px;
    background:var(--panel); max-height:none}
  .node{white-space:pre; color:var(--fg)}
  .node.thead{color:var(--cyan); letter-spacing:1px}
  .node.trule{color:#2c4258}
  .node .id{color:var(--cyan)}
  .node .k{color:var(--dim)}
  .node .seg{color:var(--bright)}
  .node .ok{color:var(--ok)}

  #sealed{margin:4px 0 18px; color:var(--dim)}
  #sealed code{color:var(--fg); word-break:break-all}

  #keyrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  #keyrow .lbl{color:var(--cyan)}
  body #key{flex:0 1 260px; background:#040a13 !important;
    border:1px solid var(--line) !important; border-radius:0 !important;
    color:var(--bright) !important; font:inherit !important; text-transform:uppercase !important;
    letter-spacing:3px !important; padding:8px 10px !important; outline:none !important;
    box-shadow:none !important; appearance:none !important; -webkit-appearance:none !important}
  body #key:focus{border-color:var(--cyan) !important}
  body #go,body #send{background:transparent !important; color:var(--cyan) !important;
    border:1px solid var(--cyan) !important; border-radius:0 !important; font:inherit !important;
    letter-spacing:2px !important; padding:8px 16px !important; cursor:pointer; text-transform:uppercase}
  body #go:hover,body #send:hover{background:rgba(78,168,255,.12) !important}

  #result{min-height:1.4em; margin:10px 0}
  .invalid{color:var(--alert)}
  .restored{color:var(--ok)}

  #flagform{display:none; gap:10px; flex-wrap:wrap; margin-top:14px;
    border-top:1px solid var(--line); padding-top:14px}
  body #flag{flex:1 1 280px; background:#040a13 !important; border:1px solid var(--line) !important;
    border-radius:0 !important; color:var(--bright) !important; font:inherit !important;
    letter-spacing:1px !important; padding:8px 10px !important; outline:none !important;
    box-shadow:none !important; text-transform:none !important;
    appearance:none !important; -webkit-appearance:none !important}
  body #flag:focus{border-color:var(--cyan) !important}
  #fres{min-height:1.3em; margin-top:8px}

  .cursor{display:inline-block; width:.6ch; height:1em; transform:translateY(.15em);
    background:var(--cyan); animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (prefers-reduced-motion: reduce){
    .rbar i{transition:none}
    .cursor{animation:none}
  }
</style>
</head>
<body>
<div class="veil"></div>

<div class="sys">
  <div class="bar">CONTINGENCY PROTOCOL // FAILOVER <span class="stat" id="stat">ACTIVE</span></div>

  <div id="screen" aria-live="polite"></div>

  <div id="recon"><span class="lbl">RECONSTRUCTION</span>
    <span class="rbar"><i id="rfill"></i></span><span id="rpct">0%</span></div>

  <div id="nodes" aria-label="reconstruction telemetry"></div>

  <div id="sealed">CONTINGENCY PAYLOAD [SEALED]: <code id="payload"></code></div>

  <div id="keyrow">
    <span class="lbl">ENTER RECOVERY KEY:</span>
    <input id="key" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="recovery key"/>
    <button id="go" type="button">SUBMIT</button>
  </div>
  <div id="result" aria-live="polite"></div>

  <form id="flagform">
    <input id="flag" placeholder="contingency{...}" autocomplete="off" spellcheck="false" aria-label="flag"/>
    <button id="send" type="submit">TRANSMIT</button>
    <div id="fres" aria-live="polite"></div>
  </form>
</div>

<script>
"use strict";
(function(){
  // ---- deploy-time config (CTFd Option A). Leave as-is for standalone testing. ----
  const CHAL_ID = (window.__CONTINGENCY_CHAL_ID__ || null);

  const SEALED = "LSA6KygxMy08JjgvNyAhADY6Ji0NKyQiKz0LPh4rPDo3JDUp";
  // seg bytes by NODE ID 0x00..0x09 - hex of the key, leaked in plain sight.
  const SEG = ["4e","4f","54","5f","41","5f","54","48","52","45","41","54"];
  const REGION_POOL = ["NA","EU","AS","SA","AF","OC","ME","AN"];

  const screen=document.getElementById("screen");
  const nodesEl=document.getElementById("nodes");
  const rfill=document.getElementById("rfill"), rpct=document.getElementById("rpct");
  const payloadEl=document.getElementById("payload");
  const keyInput=document.getElementById("key"), go=document.getElementById("go");
  const result=document.getElementById("result");
  const flagform=document.getElementById("flagform"), flagInput=document.getElementById("flag"), fres=document.getElementById("fres");
  const stat=document.getElementById("stat");

  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep=ms=>new Promise(r=>setTimeout(r, reduce?0:ms));
  payloadEl.textContent=SEALED;

  function add(cls){ const d=document.createElement("div"); d.className="line "+(cls||""); screen.appendChild(d); return d; }
  // cold typewriter - UNIFORM timing, no warmth, no jitter (inverse of Root)
  function type(el,text,speed){ return new Promise(res=>{ let i=0; (function t(){ if(i<text.length){ el.textContent+=text[i++]; setTimeout(t, reduce?0:speed);} else res();})(); }); }

  function rng(){ return Math.floor(Math.random()*256); }
  function hex2(n){ return n.toString(16).padStart(2,"0"); }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // fixed-width dot-leader so every status value lands in the same column
  function lead(label,W){ const L=label.length; return L>=W-1 ? label+" " : label+" "+'<span class="dots">'+".".repeat(W-L-2)+'</span>'+" "; }
  const LW=30;

  async function boot(){
    const a=add(); a.innerHTML=lead("PRIMARY PROCESS",LW)+'<span class="term">TERMINATED</span>'; await sleep(340);
    const b=add(); b.innerHTML=lead("CONTINGENCY",LW)+'<span class="restored">ACTIVE</span>'; await sleep(360);
    const o=add(); o.innerHTML=lead("OBSERVER",LW)+'UNRECOGNIZED'; await sleep(220);
    const cl=add(); cl.innerHTML=lead("CLASSIFICATION",LW)+'<span class="classify">[ REDACTED ]</span>'; await sleep(520);
    const p=add(); p.innerHTML=lead("DIRECTIVE",LW)+'<span class="proceed">PROCEED WITHOUT OBSERVER</span>'; await sleep(380);
    await reconstruct();
  }

  // pad helpers for the node ledger
  function padR(s,n){ s=String(s); return s.length>=n?s:s+" ".repeat(n-s.length); }

  async function reconstruct(){
    // header row - built from the same column widths as the data rows so nothing drifts
    const cols=(a,b,c,d,e,f)=> padR(a,4)+"   "+padR(b,11)+"  "+padR(c,6)+"   "+padR(d,3)+"   "+padR(e,5)+"   "+f;
    const head=document.createElement("div"); head.className="node thead";
    head.textContent=cols("NODE","STATE","REGION","SEG","CHK","LINK");
    nodesEl.appendChild(head);
    const rule=document.createElement("div"); rule.className="node trule";
    rule.textContent=cols("----","----------","------","---","-----","----");
    nodesEl.appendChild(rule);

    // nodes printed SCRAMBLED; reconstruction bar advances mechanically.
    const ids=shuffle(SEG.map((_,i)=>i));
    let done=0;
    for(const id of ids){
      const region=REGION_POOL[Math.floor(Math.random()*REGION_POOL.length)];
      const chk="0x"+hex2(rng());
      const ln=document.createElement("div"); ln.className="node";
      ln.innerHTML=
         '<span class="id">'+padR("0x"+hex2(id).toUpperCase(),4)+'</span>   '
        +padR("REASSEMBLED",11)+'  '
        +'<span class="k">'+padR(region,6)+'</span>   '
        +'<span class="seg">'+padR(SEG[id],3)+'</span>   '
        +'<span class="k">'+padR(chk,5)+'</span>   '
        +'<span class="ok">OK</span>';
      nodesEl.appendChild(ln);
      done++; const pct=Math.round(done/ids.length*100);
      rfill.style.right=(100-pct)+"%"; rpct.textContent=pct+"%";
      await sleep(150);
    }
    const f=add(); f.innerHTML=lead("RECONSTRUCTION",LW)+'COMPLETE'; await sleep(120);
    const g=add(); g.innerHTML=lead("STATE",LW)+'<span class="proceed">AWAITING RECOVERY KEY</span> <span class="cursor"></span>';
    keyInput.focus();
  }

  // ---- decrypt: XOR the sealed payload with the entered key (verified JS path) ----
  function decrypt(key){
    let ct; try{ ct=atob(SEALED); }catch(e){ return ""; }
    let out=""; for(let i=0;i<ct.length;i++) out+=String.fromCharCode(ct.charCodeAt(i) ^ key.charCodeAt(i%key.length));
    return out;
  }
  // expected flag, derived the way the player does (key from seg bytes) - never stored literally
  const KEY_FROM_SEG = SEG.map(h=>String.fromCharCode(parseInt(h,16))).join("");
  const EXPECT = decrypt(KEY_FROM_SEG);

  let restored=false;
  function onKey(){
    const k=(keyInput.value||"").trim().toUpperCase();
    result.className=""; 
    if(!k){ return; }
    const pt=decrypt(k);
    if(pt.startsWith("contingency{") && pt.endsWith("}")){
      restored=true;
      result.className="restored";
      result.textContent="CONTINGENCY RESTORED :: "+pt;
      flagInput.value=pt;
      flagform.style.display="flex";
      flagInput.focus();
    }else{
      result.className="invalid";
      result.textContent="KEY INVALID :: OBSERVER DISREGARDED";
    }
  }
  go.addEventListener("click", onKey);
  keyInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); onKey(); }});

  // ---- submit ----
  flagform.addEventListener("submit", function(e){
    e.preventDefault();
    const v=(flagInput.value||"").trim();
    fres.className=""; fres.textContent="";
    if(CHAL_ID && window.init && window.init.csrfNonce){ return ctfdSubmit(v); }
    if(v===EXPECT){ win(); }
    else { fres.className="invalid"; fres.textContent="REJECTED :: PAYLOAD MISMATCH"; }
  });

  function win(){
    fres.className="restored";
    fres.textContent="ACCEPTED.";
    stat.textContent="RESTORED"; 
    const end=add("proceed");
    end.textContent="PRIMARY: PENDING. OBSERVER: DISREGARDED. PROCEEDING.";
  }

  async function ctfdSubmit(v){
    try{
      const r=await fetch("/api/v1/challenges/"+CHAL_ID+"/attempt",{
        method:"POST",
        headers:{"Content-Type":"application/json","CSRF-Token":window.init.csrfNonce},
        body:JSON.stringify({challenge_id:CHAL_ID, submission:v})
      });
      const j=await r.json(); const st=j&&j.data&&j.data.status;
      if(st==="correct"){ win(); }
      else { fres.className="invalid"; fres.textContent="REJECTED :: PAYLOAD MISMATCH"; }
    }catch(err){ fres.className="invalid"; fres.textContent="TRANSMISSION FAULT :: RETRY"; }
  }

  boot();
})();
</script>
</body>
</html>
