# ctfcli challenge spec. Contains the flag.
name: "Tmpfs"
author: "XposedOrNot"
category: "Forensics"
type: standard
value: 300
state: visible
version: "0.1"

description: |
  [ FILE REF: S2E1 "THE CONTINGENCY" // SAFEHOUSE ASSET - MEMORY ACQUISITION ]

  He waited in the safehouse for instructions. We took it eleven seconds after his terminal lit up. He was at the keyboard. He saw us coming. He had time to type three commands and reach for the keyboard one more time before the door opened.

  He erased what he could see. He erased it from disk. He erased it from the directory listing. He believed he had succeeded because his screen showed it gone.

  He did not understand that 'erased' is not what he thought. He did not understand that the process holding his file was still alive, and the kernel was still tracking the pages, and the memory had not yet been recycled.

  The disk image is empty. The memory is not.

  Find what he kept. Find what he was about to send. Find who he is.

  - THE MACHINE

flags:
  - "number{volatile_storage_has_a_half_life}"

tags:
  - "F300"

# Challenge file is a release asset, not in this repo:
# https://github.com/WatchlistCTF/Watchlist-CTF/releases/download/2026-files/F300-tmpfs.7z
files: []

hints:
  - content: "Not every running process is the work. The operative was busy with one thing. The other tools you see are noise, operating-system defaults or forgotten tests. Read what is being done, not just what is running."
    cost: 50
  - content: "He split his key. One half he set in the environment. The other half he passed in the command. Neither alone is enough. The shell history will tell you the order he used."
    cost: 100
  - content: "He deleted the vault file before they took him. The process holding it open did not know, and neither did the kernel. Look at the open file table: what does Linux say about a file that has been deleted but is still in use?"
    cost: 150
