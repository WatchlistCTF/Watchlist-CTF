hints:
  - content: "The logs you reach for first, GCP Admin Activity, AWS CloudTrail, Azure Activity Log, are blind to data movement on purpose. The theft is in the logs analysts forget: GCS usage logs, S3 server access logs, Azure StorageBlobLogs."
    cost: 50
  - content: "Three clouds, one object. Each stores the object's MD5 in a different dialect: GCS md5Hash in base64, S3 ETag in hex, Azure Content-MD5 in base64. Normalize them and find the one object whose fingerprint matches in all three. Ignore crc32c; only GCP has it."
    cost: 100
  - content: "They cleaned up: the S3 object was overwritten, so take the noncurrent version and not the latest, and the Azure blob was soft-deleted, so include deleted blobs. The flag is three base64 fragments in the mfrag metadata of the matched object, one per cloud. Order them by the path the data took, GCP then AWS then Azure, then decode and concatenate."
    cost: 150
